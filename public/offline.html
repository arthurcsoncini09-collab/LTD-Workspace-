<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050912" />
<title>Sem conexão | NetLearn</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #050912; color: #e2e8f0;
         font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
  main { max-width: 380px; }
  img { width: 72px; height: 72px; }
  h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: -0.02em; color: #fff; }
  p { margin: 0; color: #94a3b8; line-height: 1.55; }
  .actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  a, button { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 8px;
              font: 500 15px/1 inherit; font-family: inherit; text-decoration: none; cursor: pointer; }
  button { border: 0; background: #2563eb; color: #fff; }
  a { border: 1px solid #1e293b; color: #e2e8f0; }
</style>
</head>
<body>
<main>
  <img src="/brand/netlearn-emblem.png" alt="NetLearn" />
  <h1>Você está sem internet</h1>
  <p>As páginas que você já abriu continuam disponíveis no app. Esta ainda não foi salva no aparelho — tente de novo quando a conexão voltar.</p>
  <div class="actions">
    <button type="button" onclick="location.reload()">Tentar de novo</button>
    <a href="/dashboard">Ir para o dashboard</a>
  </div>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
